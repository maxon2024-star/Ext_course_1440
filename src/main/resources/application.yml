server:
  port: 7070

spring:
  application:
    name: space-operation-center

  datasource:
    url: jdbc:postgresql://localhost:5440/space_db
    username: space_user
    password: space_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Важно! Мы используем Flyway, Hibernate только проверяет схему
    show-sql: true # Для отладки запросов (потом можно выключить)
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

grpc:
  client:
    telemetryClient:
      address: 'static://telemetry-service:9091'
      negotiation-type: plaintext

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Настройка логирования для нагрузочного тестирования и дебага
logging:
  level:
    root: INFO
    # Указываем пакет твоего проекта для более детального вывода (DEBUG)
    seminars: DEBUG
    org.springframework.web: INFO
  file:
    # Все логи будут сохраняться в отдельный файл
    name: logs/space-operation.log
  pattern:
    # Формат вывода: Дата Время [Поток] УРОВЕНЬ Класс - Сообщение
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"