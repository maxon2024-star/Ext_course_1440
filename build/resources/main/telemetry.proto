syntax = "proto3";

package telemetry;

option java_package = "seminars.telemetry.grpc";
option java_multiple_files = true;

service TelemetryService {
  rpc StreamTelemetry(TelemetryRequest) returns (stream TelemetryUpdate);
}

message TelemetryRequest {
  string client_id = 1;
}

message TelemetryUpdate {
  string satellite_id = 1;
  double temperature_inside = 2;
  double temperature_outside = 3;
}